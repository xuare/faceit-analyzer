<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACEIT Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #09090b;
  --surface: #111113;
  --border:  #1c1c1f;
  --border2: #27272a;
  --text:    #fafafa;
  --sub:     #71717a;
  --sub2:    #a1a1aa;
  --accent:  #ff6b00;
  --green:   #22c55e;
  --red:     #ef4444;
  --blue:    #3b82f6;
  --yellow:  #eab308;
  --purple:  #a855f7;
}
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { font-family: 'Geist', system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
input, button { font: inherit; }

.layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

/* SIDEBAR */
.sidebar { border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 16px; margin-bottom: 4px; }
.logo-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
.logo-text { font-size: 13px; font-weight: 600; letter-spacing: -.2px; }
.nav-label { font-size: 11px; font-weight: 500; color: var(--sub); padding: 12px 8px 4px; letter-spacing: .4px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; color: var(--sub2); cursor: pointer; transition: background .1s, color .1s; text-decoration: none; }
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--surface); color: var(--text); }
.nav-item svg { opacity: .5; flex-shrink: 0; }
.nav-item.active svg { opacity: 1; }
.sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

/* MAIN */
.main { padding: 32px 40px 64px; min-width: 0; }
.main-inner { max-width: 900px; }

/* SEARCH */
.search-section { margin-bottom: 32px; }
.search-heading { font-size: 20px; font-weight: 600; letter-spacing: -.4px; margin-bottom: 4px; }
.search-sub { font-size: 13px; color: var(--sub); margin-bottom: 20px; }
.search-row { display: flex; gap: 8px; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-field { width: 100%; height: 40px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; transition: border-color .15s; }
.search-field::placeholder { color: var(--sub); }
.search-field:focus { box-shadow: 0 0 0 3px rgba(255,107,0,.07); border-color: rgba(255,107,0,.4); }
.autocomplete { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; z-index: 100; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.autocomplete.show { display: block; }
.ac-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; transition: background .08s; }
.ac-item:hover, .ac-item.focused { background: var(--border); }
.ac-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--border2); object-fit: cover; flex-shrink: 0; display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--sub2); overflow:hidden; }
.ac-avatar img { width:100%;height:100%;object-fit:cover; }
.ac-name { font-weight: 500; }
.ac-meta { font-size: 11px; color: var(--sub); margin-left: auto; font-family: 'Geist Mono', monospace; }
.search-btn { height: 40px; padding: 0 18px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity .15s; }
.search-btn:hover { opacity: .88; }
.search-btn:disabled { opacity: .4; cursor: default; }
.compare-btn { height: 40px; padding: 0 14px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; color: var(--sub2); font-size: 13px; cursor: pointer; transition: all .15s; }
.compare-btn:hover { color: var(--text); background: var(--surface); }
.rm-btn { height: 40px; width: 40px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; color: var(--sub); font-size: 16px; cursor: pointer; flex-shrink: 0; }
.rm-btn:hover { color: var(--red); border-color: rgba(239,68,68,.3); }

/* PANELS */
.panels { display: grid; grid-template-columns: 1fr; gap: 32px; }
.panels.dual { grid-template-columns: 1fr 1fr; }

/* EMPTY */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; }
.empty-icon { font-size: 28px; margin-bottom: 12px; opacity: .2; }
.empty-title { font-size: 15px; font-weight: 500; color: var(--sub2); margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--sub); max-width: 260px; line-height: 1.6; }

/* PLAYER CARD */
.player-card { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--surface); border: 1px solid var(--border2); flex-shrink: 0; }
.avatar-fallback { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--sub2); }
.player-name { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
.player-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border: 1px solid var(--border2); border-radius: 99px; color: var(--sub2); }
.tag.accent { border-color: rgba(255,107,0,.35); color: var(--accent); }
.tag.live { border-color: rgba(34,197,94,.35); color: var(--green); animation: pulse 2s infinite; }
.tag.hot  { border-color: rgba(251,146,60,.35); color: #fb923c; }
.tag.cold { border-color: rgba(96,165,250,.35); color: #60a5fa; }
.tag.peak { border-color: rgba(168,85,247,.35); color: var(--purple); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.player-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.player-link { font-size: 12px; color: var(--sub); text-decoration: none; padding: 5px 10px; border: 1px solid var(--border2); border-radius: 6px; }
.player-link:hover { color: var(--text); background: var(--surface); }

/* ACTION BTNS */
.action-btn { font-size: 12px; color: var(--sub); background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all .15s; }
.action-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface); }
.action-btn.copied { color: var(--green); border-color: rgba(34,197,94,.3); }

/* SHARE TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 16px; font-size: 13px; color: var(--text); opacity: 0; transition: all .2s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* FORM BANNER */
.form-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
.form-banner.hot  { background: rgba(251,146,60,.07);  border: 1px solid rgba(251,146,60,.2); }
.form-banner.cold { background: rgba(96,165,250,.07);  border: 1px solid rgba(96,165,250,.2); }
.form-banner.rise { background: rgba(34,197,94,.07);   border: 1px solid rgba(34,197,94,.2); }
.form-banner.norm { background: var(--surface);        border: 1px solid var(--border); }
.form-icon { font-size: 18px; }
.form-text { font-weight: 500; }
.form-sub  { font-size: 12px; color: var(--sub); margin-left: 4px; }

/* LIVE BANNER */
.live-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(34,197,94,.05); border: 1px solid rgba(34,197,94,.15); border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; animation: pulse 1.5s infinite; }
.live-text { color: var(--green); font-weight: 500; }
.live-map  { color: var(--sub2); margin-left: 4px; }
.live-score { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--sub); margin-left: auto; }

/* STREAK */
.streak-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.streak-label { font-size: 12px; color: var(--sub); width: 52px; flex-shrink: 0; }
.streak-strip { display: flex; gap: 3px; }
.streak-pill { width: 20px; height: 6px; border-radius: 3px; }
.streak-pill.w { background: var(--green); }
.streak-pill.l { background: var(--red); }
.streak-pill.d { background: var(--border2); }
.streak-stat { font-size: 12px; color: var(--sub); font-family: 'Geist Mono', monospace; }

/* STATS GRID */
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
.stat-cell { background: var(--bg); padding: 18px 20px; }
.stat-val { font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: -.5px; line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--sub); margin-top: 5px; }

/* BEST/WORST MAPS */
.map-badges { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.map-badge { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 140px; }
.map-badge.best { border-color: rgba(34,197,94,.25); background: rgba(34,197,94,.04); }
.map-badge.worst { border-color: rgba(239,68,68,.25); background: rgba(239,68,68,.04); }
.map-badge-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--sub); }
.map-badge-name { font-size: 14px; font-weight: 600; }
.map-badge-stat { font-size: 11px; color: var(--sub2); font-family: 'Geist Mono', monospace; }
.map-badge.best .map-badge-name { color: var(--green); }
.map-badge.worst .map-badge-name { color: var(--red); }

/* ELO PROGRESS */
.elo-progress-wrap { border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; }
.elo-progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 12px; }
.elo-progress-title { font-weight: 600; color: var(--sub2); text-transform: uppercase; letter-spacing: .5px; }
.elo-progress-pct { font-family: 'Geist Mono', monospace; color: var(--sub); }
.elo-level-row { display: flex; align-items: center; gap: 10px; }
.elo-level-num { font-size: 11px; color: var(--sub); width: 16px; text-align: center; flex-shrink: 0; }
.elo-track { flex: 1; height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.elo-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .6s ease; }
.elo-progress-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--sub); font-family: 'Geist Mono', monospace; }

/* ELO CHART */
.elo-chart-wrap { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; }
.elo-chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.elo-chart-title { font-size: 12px; font-weight: 600; color: var(--sub2); text-transform: uppercase; letter-spacing: .5px; }
.elo-chart-meta { display: flex; gap: 14px; align-items: baseline; }
.elo-chart-range { font-size: 11px; color: var(--sub); font-family: 'Geist Mono', monospace; }
.elo-peak-tag { font-size: 10px; color: var(--purple); background: rgba(168,85,247,.1); border: 1px solid rgba(168,85,247,.2); border-radius: 99px; padding: 1px 7px; font-weight: 600; }
.elo-svg { width: 100%; height: 64px; display: block; }

/* SECTION */
.section { margin-bottom: 24px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-title { font-size: 12px; font-weight: 600; color: var(--sub2); text-transform: uppercase; letter-spacing: .5px; }
.hist-filters { display: flex; gap: 4px; }
.hf { padding: 3px 10px; border-radius: 5px; border: 1px solid transparent; font-size: 12px; font-weight: 500; color: var(--sub); background: none; cursor: pointer; }
.hf:hover { color: var(--sub2); }
.hf.active { border-color: var(--border2); color: var(--text); background: var(--surface); }

/* TABLE */
.tbl-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--sub); background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .08s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface); }
tbody td { padding: 9px 14px; font-size: 13px; vertical-align: middle; }
.detail-row td { padding: 0 !important; }
.detail-inner { display: none; padding: 14px 16px; background: var(--surface); border-top: 1px solid var(--border); }
.detail-inner.show { display: block; }
.detail-meta { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
.detail-teams { display: flex; gap: 24px; }
.detail-team { flex: 1; }
.team-name { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
.d-player { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.d-player:last-child { border-bottom: none; }
.d-player.me { color: var(--accent); font-weight: 600; }
.d-kda { font-family: 'Geist Mono', monospace; color: var(--sub); }
.d-player.me .d-kda { color: var(--accent); }
.map-cell { display: flex; align-items: center; gap: 8px; }
.map-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
.map-name-t { font-weight: 500; }
.res { font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace; }
.res.w { color: var(--green); }
.res.l { color: var(--red); }
.res.d { color: var(--sub); }
.elo-pos { color: var(--green); font-size: 12px; font-family: 'Geist Mono', monospace; }
.elo-neg { color: var(--red);   font-size: 12px; font-family: 'Geist Mono', monospace; }
.elo-neu { color: var(--sub);   font-size: 12px; font-family: 'Geist Mono', monospace; }
.match-id { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--sub); }
td.muted { color: var(--sub); font-size: 12px; }

/* MAP BARS */
.map-bars { padding: 4px 16px; }
.map-bar-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.map-bar-row:last-child { border-bottom: none; }
.map-bar-name { width: 90px; font-size: 13px; font-weight: 500; flex-shrink: 0; }
.map-bar-track { flex: 1; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.map-bar-fill { height: 100%; border-radius: 2px; background: var(--sub); transition: width .5s ease; }
.map-bar-fill.good { background: var(--green); }
.map-bar-fill.bad  { background: var(--red); }
.map-bar-meta { font-size: 11px; color: var(--sub); font-family: 'Geist Mono', monospace; text-align: right; width: 130px; flex-shrink: 0; }

/* RAW */
.raw-toggle { font-size: 12px; color: var(--sub); background: none; border: none; cursor: pointer; padding: 8px 0; display: block; }
.raw-toggle:hover { color: var(--sub2); }
.raw-box { display: none; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 6px; }
.raw-box.show { display: block; }
.raw-row { display: flex; justify-content: space-between; padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
.raw-row:last-child { border-bottom: none; }
.raw-row:nth-child(odd) { background: var(--surface); }
.raw-key { color: var(--sub); }

/* STATES */
.state { padding: 14px 16px; font-size: 13px; color: var(--sub); border: 1px solid var(--border); border-radius: 8px; }
.state.err { color: var(--red); border-color: rgba(239,68,68,.2); }
.chip { display: inline-block; margin: 6px 4px 0 0; padding: 4px 10px; border: 1px solid var(--border2); border-radius: 6px; font-size: 12px; color: var(--sub2); cursor: pointer; }
.chip:hover { color: var(--text); background: var(--surface); }
.spin { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--border2); border-top-color: var(--sub2); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

footer { margin-top: 48px; font-size: 12px; color: var(--sub); }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 20px; }
  .stats-grid { grid-template-columns: repeat(2,1fr); }
  .panels.dual { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">F</div>
    <span class="logo-text">FACEIT Analyzer</span>
  </div>
  <div class="nav-label">Menu</div>
  <div class="nav-item active">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </div>
  <div class="nav-item">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Leaderboard
  </div>
  <div class="nav-item">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
    Tournaments
  </div>
  <div class="nav-item">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Browse
  </div>
  <div class="sidebar-footer">
    <div class="nav-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      Settings
    </div>
  </div>
</aside>

<main class="main">
<div class="main-inner">
  <div class="search-section">
    <h1 class="search-heading">Player Stats</h1>
    <p class="search-sub">Search any FACEIT CS2 player to view their statistics.</p>
    <div class="search-row" id="search-row"></div>
    <div style="margin-top:8px">
      <button class="compare-btn" id="compare-btn">Compare two players</button>
    </div>
  </div>

  <div class="panels" id="panels">
    <div class="panel" id="panel-0">
      <div class="empty">
        <div class="empty-icon">◎</div>
        <div class="empty-title">No player selected</div>
        <div class="empty-sub">Enter a FACEIT nickname above and hit Search</div>
      </div>
    </div>
  </div>
  <footer>FACEIT Analyzer · FACEIT Data API v4</footer>
</div>
</main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ── utils ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(p){ const r=await fetch(p); const d=await r.json().catch(()=>null); if(!r.ok) throw new Error((d&&d.error)||'Error '+r.status); return d; }
function fdate(ts){ if(!ts) return '—'; return new Date(ts*1000).toLocaleDateString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function pick(lt,keys){ for(const k of keys) if(lt[k]!=null) return lt[k]; return null; }
function toast(msg,ms=2200){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),ms); }

/* ── Shareable URL ── */
function applyUrlPlayer(){
  const p=new URLSearchParams(location.search).get('player');
  if(p){ setTimeout(()=>{ const inp=document.getElementById('inp-0'); if(inp){ inp.value=p; load(0,p); }},100); }
}
function pushUrl(nick){
  const u=new URL(location.href); u.searchParams.set('player',nick); history.replaceState(null,'',u); }

/* ── ELO levels ── */
const ELO_LVL=[0,500,750,900,1050,1200,1350,1530,1710,1900,2100,5000];
function eloProgress(elo){
  const e=parseInt(elo,10)||0;
  for(let i=0;i<ELO_LVL.length-1;i++){
    if(e>=ELO_LVL[i]&&e<ELO_LVL[i+1]){
      const pct=Math.round((e-ELO_LVL[i])/(ELO_LVL[i+1]-ELO_LVL[i])*100);
      return {level:i+1,pct,current:e,min:ELO_LVL[i],max:ELO_LVL[i+1],wins:Math.ceil((ELO_LVL[i+1]-e)/25)};
    }
  }
  return {level:10,pct:100,current:e,min:ELO_LVL[9],max:ELO_LVL[10],wins:0};
}

/* ── Form analysis ── */
function analyzeForm(recent){
  if(!recent||recent.length<3) return null;
  const wins=recent.filter(r=>r==='1').length;
  const wr=wins/recent.length;
  // Check trend: first half vs second half
  const half=Math.floor(recent.length/2);
  const early=recent.slice(0,half).filter(r=>r==='1').length/half;
  const late=recent.slice(half).filter(r=>r==='1').length/(recent.length-half);
  const rising=late-early>0.2;
  const falling=early-late>0.2;

  if(wr>=0.7) return {cls:'hot',icon:'🔥',text:'Hot Streak',sub:`${Math.round(wr*100)}% WR in last ${recent.length}`};
  if(wr<=0.3) return {cls:'cold',icon:'❄️',text:'Cold Spell',sub:`${Math.round(wr*100)}% WR in last ${recent.length}`};
  if(rising)  return {cls:'rise',icon:'📈',text:'Rising Form',sub:`Win rate improving recently`};
  if(falling) return {cls:'norm',icon:'📉',text:'Declining Form',sub:`Win rate dropping recently`};
  return      {cls:'norm',icon:'➖',text:'Stable Form',sub:`${Math.round(wr*100)}% WR in last ${recent.length}`};
}

/* ── ELO chart SVG ── */
function buildChart(pts){
  if(!pts||pts.length<2) return '<span style="color:var(--sub);font-size:12px">Not enough data</span>';
  const W=500,H=64,pad=4;
  const min=Math.min(...pts)-10, max=Math.max(...pts)+10;
  const sx=i=>(i/(pts.length-1))*(W-pad*2)+pad;
  const sy=v=>H-pad-(v-min)/(max-min)*(H-pad*2);
  const polyPts=pts.map((v,i)=>`${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' ');
  const area=`M ${sx(0).toFixed(1)},${H} `+pts.map((v,i)=>`L ${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' ')+` L ${sx(pts.length-1).toFixed(1)},${H} Z`;
  const last=pts[pts.length-1],first=pts[0];
  const col=last>=first?'#22c55e':'#ef4444';
  return `<svg class="elo-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="cg${Math.random().toString(36).slice(2)}" x1="0" y1="0" x2="0" y2="1" id="cgg">
      <stop offset="0%" stop-color="${col}" stop-opacity=".18"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#cgg)"/>
    <polyline points="${polyPts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${sx(pts.length-1).toFixed(1)}" cy="${sy(last).toFixed(1)}" r="3.5" fill="${col}"/>
  </svg>`;
}

  {keys:['Current Win Streak'],                label:'Current Streak',fmt:v=>v},

function renderStats(lt){

  return cells.length?`<div class="stats-grid">${cells.join('')}</div>`:'<div class="state">No lifetime stats.</div>';
}

/* ── Best/Worst map ── */
function renderMapBadges(segs){
  const maps=(segs||[]).filter(s=>s.type==='Map').map(s=>({
    name:s.label||'Map',
    matches:parseInt((s.stats||{}).Matches,10)||0,
    wr:parseFloat((s.stats||{})['Win Rate %'])||0,
    kd:(s.stats||{})['K/D Ratio']||(s.stats||{})['Average K/D Ratio']||'—'
  })).filter(m=>m.matches>=5).sort((a,b)=>b.wr-a.wr);
  if(maps.length<2) return '';

  return `<div class="map-badges">
    <div class="map-badge best">
      <span class="map-badge-label">Best Map</span>
      <span class="map-badge-name">${esc(best.name)}</span>
      <span class="map-badge-stat">${Math.round(best.wr)}% WR · KD ${esc(best.kd)}</span>

      <span class="map-badge-label">Worst Map</span>
      <span class="map-badge-name">${esc(worst.name)}</span>
      <span class="map-badge-stat">${Math.round(worst.wr)}% WR · KD ${esc(worst.kd)}</span>

/* ── Streak ── */
function renderStreak(arr){

}

/* ── History ── */
async function loadHistory(sid,pid,lim,eloCtx){
  const tbody=document.getElementById('tbody-'+sid); if(!tbody) return;
  tbody.innerHTML=`<tr><td colspan="6" class="muted" style="padding:14px"><span class="spin"></span></td></tr>`;
  try{
    const h=await api('/api/player-id/'+pid+'/history?limit='+lim);
    const items=h.items||[];
    if(!items.length){ tbody.innerHTML=`<tr><td colspan="6" class="muted" style="padding:14px">No matches.</td></tr>`; return; }

    // Build ELO chart points
    if(eloCtx){
      let cur=eloCtx.startElo, pts=[];
      for(let i=items.length-1;i>=0;i--){
        const f=faction(items[i],pid);
        const ec=items[i].elo_changes&&f?parseInt(items[i].elo_changes[f],10)||0:0;
        pts.push(cur); cur+=ec;
      }
      pts.push(cur);
      eloCtx.data=pts;
      const chartEl=document.getElementById('elo-chart-svg-'+sid);
      const rangeEl=document.getElementById('elo-chart-range-'+sid);
      const peakEl=document.getElementById('elo-peak-'+sid);
      if(chartEl&&pts.length>1){
        const peakElo=Math.max(...pts);
        chartEl.innerHTML=buildChart(pts);
        if(rangeEl) rangeEl.textContent=`${Math.min(...pts)} – ${Math.max(...pts)}`;
        if(peakEl&&peakElo>eloCtx.startElo) peakEl.textContent=`Peak ${peakElo}`;
        else if(peakEl) peakEl.style.display='none';
      }
    }

    tbody.innerHTML=items.map(m=>{
      const f2=faction(m,pid),w=m.results&&m.results.winner;
      const win=f2&&w?f2===w:null;
      const score=m.results&&m.results.score?(m.results.score[f2]+':'+m.results.score[f2==='faction1'?'faction2':'faction1']):'—';
      const elo=m.elo_changes&&f2?m.elo_changes[f2]:null;
      const map=(m.voting&&m.voting.map&&m.voting.map.pick&&m.voting.map.pick[0])||m.game_mode||'—';
      const resH=win===null?`<span class="res d">?</span>`:(win?`<span class="res w">${esc(score)}</span>`:`<span class="res l">${esc(score)}</span>`);
      let eloH='<span class="elo-neu">—</span>';
      if(elo!==null){ const n=parseInt(elo,10); eloH=n>0?`<span class="elo-pos">+${n}</span>`:n<0?`<span class="elo-neg">${n}</span>`:`<span class="elo-neu">±0</span>`; }
      const mid=m.match_id||'';
      return `<tr data-mid="${esc(mid)}" data-pid="${esc(pid)}">
        <td><div class="map-cell"><div class="map-dot"></div><span class="map-name-t">${esc(map)}</span></div></td>
        <td>${resH}</td><td>${eloH}</td>
        <td class="muted">${esc(fdate(m.finished_at))}</td>
        <td class="muted">—</td>
        <td><span class="match-id">${esc(mid.slice(0,14))}…</span></td>
      </tr><tr class="detail-row"><td colspan="6"><div class="detail-inner" id="di-${esc(mid)}"></div></td></tr>`;
    }).join('');
    wireRows(tbody.closest('table'));
  }catch(e){
    tbody.innerHTML=`<tr><td colspan="6" style="padding:14px;color:var(--red);font-size:12px">${esc(e.message)}</td></tr>`;
  }
}

function wireRows(tbl){
  tbl.querySelectorAll('tbody tr[data-mid]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const mid=tr.dataset.mid,pid=tr.dataset.pid;
      const box=document.getElementById('di-'+mid); if(!box) return;
      if(box.classList.contains('show')){ box.classList.remove('show'); return; }
      openDetail(mid,pid,box);
    });
  });
}

async function openDetail(mid,pid,box){
  box.classList.add('show'); box.innerHTML=`<span class="spin"></span>`;
  try{
    const d=await api('/api/match/'+mid+'/stats');
    const rnd=d.rounds&&d.rounds[0];
    if(!rnd){ box.innerHTML='<span style="color:var(--sub);font-size:12px">No stats.</span>'; return; }
    const rs=rnd.round_stats||{};
    const meta=`<div class="detail-meta">Map: <b>${esc(rs.Map||'—')}</b> &nbsp;·&nbsp; Score: <b>${esc(rs.Score||'—')}</b></div>`;
    const teams=`<div class="detail-teams">${(rnd.teams||[]).map(t=>{
      const tn=(t.team_stats&&t.team_stats.Team)||'Team';
      const ps=(t.players||[]).map(p=>{ const s=p.player_stats||{},me=p.player_id===pid;
        return `<div class="d-player${me?' me':''}"><span>${esc(p.nickname)}</span><span class="d-kda">${esc(s.Kills||0)}/${esc(s.Deaths||0)}/${esc(s.Assists||0)}</span></div>`;
      }).join('');
      return `<div class="detail-team"><div class="team-name">${esc(tn)}</div>${ps}</div>`;
    }).join('')}</div>`;
    box.innerHTML=meta+teams;
  }catch(e){ box.innerHTML=`<span style="color:var(--red);font-size:12px">${esc(e.message)}</span>`; }
}

/* ── Autocomplete ── */
const acTimers={};
function setupAC(sid){
  const inp=document.getElementById('inp-'+sid);
  const ac=document.getElementById('ac-'+sid);
  if(!inp||!ac) return;
  let idx=-1;
  inp.addEventListener('input',()=>{
    clearTimeout(acTimers[sid]);
    const q=inp.value.trim();
    if(q.length<2){ ac.classList.remove('show'); return; }
    acTimers[sid]=setTimeout(async()=>{
      try{
        const s=await api('/api/search?nickname='+encodeURIComponent(q));
        const items=(s.items||[]).slice(0,7);
        if(!items.length){ ac.classList.remove('show'); return; }
        ac.innerHTML=items.map(p=>`<div class="ac-item" data-nick="${esc(p.nickname)}">
          <div class="ac-avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc((p.nickname||'?').slice(0,2).toUpperCase())}</div>
          <span class="ac-name">${esc(p.nickname)}</span>
          <span class="ac-meta">${p.games&&p.games.cs2?'ELO '+p.games.cs2.faceit_elo:''}</span>
        </div>`).join('');
        ac.querySelectorAll('.ac-item').forEach(el=>el.addEventListener('mousedown',e=>{ e.preventDefault(); inp.value=el.dataset.nick; ac.classList.remove('show'); go(); }));
        ac.classList.add('show'); idx=-1;
      }catch(_){}
    },260);
  });
  inp.addEventListener('keydown',e=>{
    const items=ac.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(idx+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('focused',i===idx)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(idx-1,0); items.forEach((el,i)=>el.classList.toggle('focused',i===idx)); }
    else if(e.key==='Enter'&&idx>=0){ inp.value=items[idx].dataset.nick; ac.classList.remove('show'); go(); }
    else if(e.key==='Enter'&&idx<0){ go(); }
    else if(e.key==='Escape'){ ac.classList.remove('show'); }
  });
  document.addEventListener('click',e=>{ if(!ac.contains(e.target)&&e.target!==inp) ac.classList.remove('show'); });
}

/* ── Slots ── */
let slots=[{id:0}], slotState={};
const searchRow=document.getElementById('search-row');
const panelsEl=document.getElementById('panels');
const compareBtn=document.getElementById('compare-btn');

function renderInputs(){
  searchRow.innerHTML=slots.map(s=>
    `<div class="search-wrap"><input class="search-field" type="text" placeholder="Nickname…" id="inp-${s.id}" autocomplete="off"><div class="autocomplete" id="ac-${s.id}"></div></div>`+
    (slots.length>1?`<button class="rm-btn" data-rm="${s.id}">✕</button>`:'')+
    (s===slots[slots.length-1]?`<button class="search-btn" id="go-btn">Search</button>`:'')
  ).join('');
  searchRow.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
    slots=slots.filter(s=>s.id!==+b.dataset.rm); delete slotState[+b.dataset.rm]; renderInputs(); renderPanels(); compareBtn.textContent='Compare two players';
  }));
  document.getElementById('go-btn').addEventListener('click',go);
  slots.forEach(s=>setupAC(s.id));
}

compareBtn.addEventListener('click',()=>{
  if(slots.length===1){ slots.push({id:1}); compareBtn.textContent='Remove comparison'; }
  else { slots=[{id:0}]; delete slotState[1]; compareBtn.textContent='Compare two players'; }
  renderInputs(); renderPanels();
});

function renderPanels(){ panelsEl.className='panels'+(slots.length>1?' dual':''); panelsEl.innerHTML=slots.map(s=>`<div class="panel" id="panel-${s.id}"></div>`).join(''); }
function setPanel(id,html){ const e=document.getElementById('panel-'+id); if(e) e.innerHTML=html; }
function go(){ slots.forEach(s=>{ const inp=document.getElementById('inp-'+s.id); const n=inp&&inp.value.trim(); if(n) load(s.id,n); }); }

/* ── Copy stats ── */
function copyStats(nick,elo,lvl,lt){
  const wr=pick(lt,['Win Rate %'])||'—';
  const kd=pick(lt,['Average K/D Ratio','K/D Ratio'])||'—';
  const hs=pick(lt,['Average Headshots %','Headshots %'])||'—';
  const m=pick(lt,['Matches'])||'—';
  const text=`${nick} | ELO ${elo} | Level ${lvl} | KD ${parseFloat(kd).toFixed(2)} | WR ${parseFloat(wr).toFixed(1)}% | HS ${parseFloat(hs).toFixed(1)}% | Matches ${m}`;
  navigator.clipboard.writeText(text).then(()=>toast('📋 Copied to clipboard!')).catch(()=>toast('Could not copy'));
}

/* ── Share link ── */
function shareLink(nick){
  const url=`${location.origin}${location.pathname}?player=${encodeURIComponent(nick)}`;
  navigator.clipboard.writeText(url).then(()=>toast('🔗 Link copied!')).catch(()=>{ prompt('Copy this link:',url); });
  pushUrl(nick);
}

  // wire buttons — need player + lt for copy
  let cachedLt={};
  document.getElementById('copy-btn-'+id).addEventListener('click',()=>copyStats(player.nickname||nick,elo,lvl,cachedLt));
  document.getElementById('share-btn-'+id).addEventListener('click',()=>shareLink(player.nickname||nick));

  // hist filters
  document.getElementById('hf-'+id).querySelectorAll('[data-n]').forEach(b=>{
    b.addEventListener('click',()=>{
      document.getElementById('hf-'+id).querySelectorAll('[data-n]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); slotState[id].limit=+b.dataset.n;
      loadHistory(id,player.player_id,slotState[id].limit,null);
    });
  });

  checkLive(player.player_id,id);
  loadHistory(id,player.player_id,lim,eloCtx);

  try{
    const st=await api('/api/player-id/'+player.player_id+'/stats');
    const lt=st.lifetime||{};
    cachedLt=lt;

    document.getElementById('stats-'+id).innerHTML=renderStats(lt);
    document.getElementById('maps-'+id).innerHTML=renderMaps(st.segments);
    document.getElementById('map-badges-'+id).innerHTML=renderMapBadges(st.segments);

    // streak + form
    const recent=lt['Recent Results'];
    if(recent){ const arr=Array.isArray(recent)?recent:String(recent).split('');
      document.getElementById('streak-'+id).innerHTML=renderStreak(arr);
      const form=analyzeForm(arr);
      if(form){
        const fb=document.getElementById('form-banner-'+id);
        if(fb) fb.innerHTML=`<div class="form-banner ${form.cls}"><span class="form-icon">${form.icon}</span><span class="form-text">${form.text}</span><span class="form-sub">· ${form.sub}</span></div>`;
      }
    }

    // raw stats
    const rw=document.getElementById('raw-wrap-'+id);
    if(rw&&Object.keys(lt).length){
      const rows=Object.keys(lt).filter(k=>k!=='Recent Results').map(k=>`<div class="raw-row"><span class="raw-key">${esc(k)}</span><span>${esc(lt[k])}</span></div>`).join('');
      rw.innerHTML=`<button class="raw-toggle" id="rt-${id}">Show all API metrics ↓</button><div class="raw-box" id="rb-${id}">${rows}</div>`;
      document.getElementById('rt-'+id).addEventListener('click',()=>{
        document.getElementById('rb-'+id).classList.toggle('show');
        document.getElementById('rt-'+id).textContent=document.getElementById('rb-'+id).classList.contains('show')?'Hide metrics ↑':'Show all API metrics ↓';
      });
    }
  }catch(e){ document.getElementById('stats-'+id).innerHTML=`<div class="state err">${esc(e.message)}</div>`; }
}

function renderEloProgress(elo){
  const p=eloProgress(elo);
  return `<div class="elo-progress-wrap">
    <div class="elo-progress-head"><span class="elo-progress-title">ELO Progress</span><span class="elo-progress-pct">Level ${p.level} · ${p.pct}% · ${p.wins>0?p.wins+' wins to next lvl':'Max level'}</span></div>
    <div class="elo-level-row"><span class="elo-level-num">${p.level}</span><div class="elo-track"><div class="elo-fill" style="width:${p.pct}%"></div></div><span class="elo-level-num">${p.level<10?p.level+1:10}</span></div>
    <div class="elo-progress-labels"><span>${p.min}</span><span>${parseInt(elo,10)} ELO</span><span>${p.max}</span></div>
  </div>`;
}

renderInputs();
applyUrlPlayer();
})();
</script>
</body>
</html>
