<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACEIT Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #09090b;
  --surface: #111113;
  --border:  #1c1c1f;
  --border2: #27272a;
  --text:    #fafafa;
  --sub:     #71717a;
  --sub2:    #a1a1aa;
  --accent:  #ff6b00;
  --green:   #22c55e;
  --red:     #ef4444;
  --blue:    #3b82f6;
  --yellow:  #eab308;
}
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { font-family: 'Geist', system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
input, button { font: inherit; }

.layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

/* SIDEBAR */
.sidebar { border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 16px; margin-bottom: 4px; }
.logo-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
.logo-text { font-size: 13px; font-weight: 600; letter-spacing: -.2px; }
.nav-label { font-size: 11px; font-weight: 500; color: var(--sub); padding: 12px 8px 4px; letter-spacing: .4px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; color: var(--sub2); cursor: pointer; transition: background .1s, color .1s; text-decoration: none; }
.nav-item:hover { background: var(--surface); color: var(--text); }
.nav-item.active { background: var(--surface); color: var(--text); }
.nav-item svg { opacity: .5; flex-shrink: 0; }
.nav-item.active svg { opacity: 1; }
.sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

/* MAIN */
.main { padding: 32px 40px 64px; min-width: 0; }
.main-inner { max-width: 900px; }

/* SEARCH */
.search-section { margin-bottom: 32px; }
.search-heading { font-size: 20px; font-weight: 600; letter-spacing: -.4px; margin-bottom: 4px; }
.search-sub { font-size: 13px; color: var(--sub); margin-bottom: 20px; }
.search-row { display: flex; gap: 8px; flex-wrap: wrap; }

.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-field { width: 100%; height: 40px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; transition: border-color .15s; }
.search-field::placeholder { color: var(--sub); }
.search-field:focus { border-color: var(--border2); box-shadow: 0 0 0 3px rgba(255,107,0,.07); }
.autocomplete { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; z-index: 100; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.autocomplete.show { display: block; }
.ac-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; transition: background .08s; }
.ac-item:hover, .ac-item.focused { background: var(--border); }
.ac-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--border2); object-fit: cover; flex-shrink: 0; }
.ac-name { font-weight: 500; }
.ac-meta { font-size: 11px; color: var(--sub); margin-left: auto; }

.search-btn { height: 40px; padding: 0 18px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity .15s; }
.search-btn:hover { opacity: .88; }
.search-btn:disabled { opacity: .4; cursor: default; }
.compare-btn { height: 40px; padding: 0 14px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; color: var(--sub2); font-size: 13px; cursor: pointer; transition: all .15s; }
.compare-btn:hover { color: var(--text); background: var(--surface); }
.rm-btn { height: 40px; width: 40px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; color: var(--sub); font-size: 16px; cursor: pointer; flex-shrink: 0; }
.rm-btn:hover { color: var(--red); border-color: rgba(239,68,68,.3); }

/* PANELS */
.panels { display: grid; grid-template-columns: 1fr; gap: 32px; }
.panels.dual { grid-template-columns: 1fr 1fr; }

/* EMPTY */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; color: var(--sub); }
.empty-icon { font-size: 28px; margin-bottom: 12px; opacity: .3; }
.empty-title { font-size: 15px; font-weight: 500; color: var(--sub2); margin-bottom: 6px; }
.empty-sub { font-size: 13px; max-width: 260px; line-height: 1.6; }

/* PLAYER CARD */
.player-card { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--surface); border: 1px solid var(--border2); flex-shrink: 0; }
.avatar-fallback { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--sub2); }
.player-name { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
.player-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border: 1px solid var(--border2); border-radius: 99px; color: var(--sub2); }
.tag.accent { border-color: rgba(255,107,0,.35); color: var(--accent); }
.tag.live { border-color: rgba(34,197,94,.35); color: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.player-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.player-link { font-size: 12px; color: var(--sub); text-decoration: none; }
.player-link:hover { color: var(--text); }

/* LIVE BANNER */
.live-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(34,197,94,.05); border: 1px solid rgba(34,197,94,.15); border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; animation: pulse 1.5s infinite; }
.live-text { color: var(--green); font-weight: 500; }
.live-map { color: var(--sub2); margin-left: 4px; }
.live-score { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--sub); margin-left: auto; }

/* STREAK STRIP */
.streak-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.streak-label { font-size: 12px; color: var(--sub); width: 80px; flex-shrink: 0; }
.streak-strip { display: flex; gap: 3px; }
.streak-pill { width: 20px; height: 6px; border-radius: 3px; }
.streak-pill.w { background: var(--green); }
.streak-pill.l { background: var(--red); }
.streak-pill.d { background: var(--border2); }
.streak-current { font-size: 12px; color: var(--sub); font-family: 'Geist Mono', monospace; }

/* STATS GRID */
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 28px; }
.stat-cell { background: var(--bg); padding: 18px 20px; }
.stat-val { font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: -.5px; line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--sub); margin-top: 5px; }

/* ELO CHART */
.elo-chart-wrap { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 28px; }
.elo-chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.elo-chart-title { font-size: 12px; font-weight: 600; color: var(--sub2); text-transform: uppercase; letter-spacing: .5px; }
.elo-chart-range { font-size: 11px; color: var(--sub); }
.elo-svg { width: 100%; height: 64px; display: block; }

/* SECTION */
.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-title { font-size: 12px; font-weight: 600; color: var(--sub2); text-transform: uppercase; letter-spacing: .5px; }

/* HIST FILTERS */
.hist-filters { display: flex; gap: 4px; }
.hf { padding: 3px 10px; border-radius: 5px; border: 1px solid transparent; font-size: 12px; font-weight: 500; color: var(--sub); background: none; cursor: pointer; }
.hf:hover { color: var(--sub2); }
.hf.active { border-color: var(--border2); color: var(--text); background: var(--surface); }

/* TABLE */
.tbl-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--sub); background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .08s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface); }
tbody td { padding: 9px 14px; font-size: 13px; vertical-align: middle; }
.detail-row td { padding: 0 !important; }
.detail-inner { display: none; padding: 14px 16px; background: var(--surface); border-top: 1px solid var(--border); }
.detail-inner.show { display: block; }
.detail-meta { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
.detail-teams { display: flex; gap: 24px; }
.detail-team { flex: 1; }
.team-name { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
.d-player { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.d-player:last-child { border-bottom: none; }
.d-player.me { color: var(--accent); font-weight: 600; }
.d-kda { font-family: 'Geist Mono', monospace; color: var(--sub); }
.d-player.me .d-kda { color: var(--accent); }

.map-cell { display: flex; align-items: center; gap: 8px; }
.map-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
.map-name { font-weight: 500; }
.res { font-size: 12px; font-weight: 600; font-family: 'Geist Mono', monospace; }
.res.w { color: var(--green); }
.res.l { color: var(--red); }
.res.d { color: var(--sub); }
.elo-pos { color: var(--green); font-size: 12px; font-family: 'Geist Mono', monospace; }
.elo-neg { color: var(--red);   font-size: 12px; font-family: 'Geist Mono', monospace; }
.elo-neu { color: var(--sub);   font-size: 12px; font-family: 'Geist Mono', monospace; }
.match-id { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--sub); }
td.muted { color: var(--sub); font-size: 12px; }

/* MAP BARS */
.map-bars { padding: 4px 16px; }
.map-bar-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.map-bar-row:last-child { border-bottom: none; }
.map-bar-name { width: 90px; font-size: 13px; font-weight: 500; flex-shrink: 0; }
.map-bar-track { flex: 1; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.map-bar-fill { height: 100%; border-radius: 2px; background: var(--sub); transition: width .5s ease; }
.map-bar-fill.good { background: var(--green); }
.map-bar-fill.bad  { background: var(--red); }
.map-bar-meta { font-size: 11px; color: var(--sub); font-family: 'Geist Mono', monospace; text-align: right; width: 130px; flex-shrink: 0; }

/* RAW */
.raw-toggle { font-size: 12px; color: var(--sub); background: none; border: none; cursor: pointer; padding: 8px 0; display: block; }
.raw-toggle:hover { color: var(--sub2); }
.raw-box { display: none; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 6px; }
.raw-box.show { display: block; }
.raw-row { display: flex; justify-content: space-between; padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
.raw-row:last-child { border-bottom: none; }
.raw-row:nth-child(odd) { background: var(--surface); }
.raw-key { color: var(--sub); }

/* ELO PROGRESS */
.elo-progress-wrap { border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 28px; }
.elo-progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 12px; }
.elo-progress-title { font-weight: 600; color: var(--sub2); text-transform: uppercase; letter-spacing: .5px; }
.elo-progress-pct { font-family: 'Geist Mono', monospace; color: var(--sub); }
.elo-level-row { display: flex; align-items: center; gap: 10px; }
.elo-level-num { font-size: 11px; color: var(--sub); width: 16px; text-align: center; }
.elo-track { flex: 1; height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.elo-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .6s ease; }
.elo-progress-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--sub); font-family: 'Geist Mono', monospace; }

/* STATES */
.state { padding: 14px 16px; font-size: 13px; color: var(--sub); border: 1px solid var(--border); border-radius: 8px; }
.state.err { color: var(--red); border-color: rgba(239,68,68,.2); }
.chip { display: inline-block; margin: 6px 4px 0 0; padding: 4px 10px; border: 1px solid var(--border2); border-radius: 6px; font-size: 12px; color: var(--sub2); cursor: pointer; }
.chip:hover { color: var(--text); background: var(--surface); }
.spin { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--border2); border-top-color: var(--sub2); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

footer { margin-top: 48px; font-size: 12px; color: var(--sub); }

/* RESPONSIVE */
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 20px; }
  .stats-grid { grid-template-columns: repeat(2,1fr); }
  .panels.dual { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">F</div>
    <span class="logo-text">FACEIT Analyzer</span>
  </div>
  <div class="nav-label">Menu</div>
  <div class="nav-item active">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </div>
  <div class="nav-item">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Leaderboard
  </div>
  <div class="nav-item">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
    Tournaments
  </div>
  <div class="nav-item">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Browse
  </div>
  <div class="sidebar-footer">
    <div class="nav-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      Settings
    </div>
  </div>
</aside>

<main class="main">
<div class="main-inner">
  <div class="search-section">
    <h1 class="search-heading">Player Stats</h1>
    <p class="search-sub">Search any FACEIT CS2 player to view their statistics.</p>
    <div class="search-row" id="search-row"></div>
    <div style="margin-top:8px">
      <button class="compare-btn" id="compare-btn" type="button">Compare two players</button>
    </div>
  </div>

  <div class="panels" id="panels">
    <div class="panel" id="panel-0">
      <div class="empty">
        <div class="empty-icon">◎</div>
        <div class="empty-title">No player selected</div>
        <div class="empty-sub">Enter a FACEIT nickname above and hit Search</div>
      </div>
    </div>
  </div>

  <footer>FACEIT Analyzer · data from FACEIT Data API v4</footer>
</div>
</main>
</div>
<script>
(function(){
'use strict';

/* ── utils ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path){ const r=await fetch(path); const d=await r.json().catch(()=>null); if(!r.ok) throw new Error((d&&d.error)||'Error '+r.status); return d; }
function fdate(ts){ if(!ts) return '—'; return new Date(ts*1000).toLocaleDateString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function pick(lt,keys){ for(var k of keys) if(lt[k]!=null) return lt[k]; return null; }

/* ── ELO level thresholds ── */
var ELO_LEVELS=[0,500,750,900,1050,1200,1350,1530,1710,1900,2100,5000];
function eloProgress(elo){
  var e=parseInt(elo,10)||0;
  for(var i=0;i<ELO_LEVELS.length-1;i++){
    if(e>=ELO_LEVELS[i]&&e<ELO_LEVELS[i+1]){
      var pct=Math.round((e-ELO_LEVELS[i])/(ELO_LEVELS[i+1]-ELO_LEVELS[i])*100);
      return {level:i+1,pct,current:e,min:ELO_LEVELS[i],max:ELO_LEVELS[i+1]};
    }
  }
  return {level:10,pct:100,current:e,min:ELO_LEVELS[9],max:ELO_LEVELS[10]};
}

/* ── ELO sparkline SVG ── */
function buildChart(eloPoints){
  if(!eloPoints||eloPoints.length<2) return '';
  var W=500,H=64,pad=4;
  var min=Math.min(...eloPoints)-20, max=Math.max(...eloPoints)+20;
  var scaleX=i=>(i/(eloPoints.length-1))*(W-pad*2)+pad;
  var scaleY=v=>H-pad-(v-min)/(max-min)*(H-pad*2);
  var pts=eloPoints.map((v,i)=>`${scaleX(i).toFixed(1)},${scaleY(v).toFixed(1)}`).join(' ');
  // area fill
  var areaPath=`M ${scaleX(0).toFixed(1)},${H} `+eloPoints.map((v,i)=>`L ${scaleX(i).toFixed(1)},${scaleY(v).toFixed(1)}`).join(' ')+` L ${scaleX(eloPoints.length-1).toFixed(1)},${H} Z`;
  var last=eloPoints[eloPoints.length-1], prev=eloPoints[0];
  var col=last>=prev?'#22c55e':'#ef4444';
  return `<svg class="elo-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".15"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#cg)"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${scaleX(eloPoints.length-1).toFixed(1)}" cy="${scaleY(last).toFixed(1)}" r="3" fill="${col}"/>
  </svg>`;
}

/* ── STATS ── */
var STATS=[
  {keys:['Win Rate %'],                          label:'Win Rate',      fmt:v=>parseFloat(v).toFixed(1)+'%'},
  {keys:['Average Headshots %','Headshots %'],   label:'Headshots',     fmt:v=>parseFloat(v).toFixed(1)+'%'},
  {keys:['Average K/D Ratio','K/D Ratio'],       label:'K/D Ratio',     fmt:v=>parseFloat(v).toFixed(2)},
  {keys:['Average Kills'],                       label:'Avg Kills',     fmt:v=>parseFloat(v).toFixed(1)},
  {keys:['Matches'],                             label:'Matches',       fmt:v=>parseInt(v,10).toLocaleString()},
  {keys:['Wins'],                                label:'Wins',          fmt:v=>parseInt(v,10).toLocaleString()},
  {keys:['Longest Win Streak'],                  label:'Best Streak',   fmt:v=>v},
  {keys:['Current Win Streak'],                  label:'Current Streak',fmt:v=>v},
];

function renderStats(lt){
  var cells=STATS.map(s=>{ var v=pick(lt,s.keys); if(v==null) return ''; return `<div class="stat-cell"><div class="stat-val">${esc(s.fmt(v))}</div><div class="stat-lbl">${s.label}</div></div>`; }).filter(Boolean);
  if(!cells.length) return '<div class="state">No lifetime stats available.</div>';
  return `<div class="stats-grid">${cells.join('')}</div>`;
}

/* ── ELO progress bar ── */
function renderEloProgress(elo){
  var p=eloProgress(elo);
  return `<div class="elo-progress-wrap">
    <div class="elo-progress-head">
      <span class="elo-progress-title">ELO Progress</span>
      <span class="elo-progress-pct">Level ${p.level} · ${p.pct}% to next</span>
    </div>
    <div class="elo-level-row">
      <span class="elo-level-num">${p.level}</span>
      <div class="elo-track"><div class="elo-fill" style="width:${p.pct}%"></div></div>
      <span class="elo-level-num">${p.level<10?p.level+1:10}</span>
    </div>
    <div class="elo-progress-labels"><span>${p.min} ELO</span><span>${parseInt(elo,10)} ELO</span><span>${p.max} ELO</span></div>
  </div>`;
}

/* ── STREAK STRIP ── */
function renderStreak(recent){
  if(!recent||!recent.length) return '';
  var pills=recent.map(r=>{
    var cls=r==='1'?'w':r==='0'?'l':'d';
    return `<div class="streak-pill ${cls}" title="${cls==='w'?'Win':cls==='l'?'Loss':'—'}"></div>`;
  }).join('');
  var wins=recent.filter(r=>r==='1').length;
  return `<div class="streak-wrap">
    <span class="streak-label">Last ${recent.length}</span>
    <div class="streak-strip">${pills}</div>
    <span class="streak-current">${wins}W ${recent.length-wins}L</span>
  </div>`;
}

/* ── MAPS ── */
function renderMaps(segs){
  var maps=(segs||[]).filter(s=>s.type==='Map').map(s=>({
    name:s.label||'Map',
    matches:parseInt((s.stats||{}).Matches,10)||0,
    wr:parseFloat((s.stats||{})['Win Rate %'])||0,
    kd:(s.stats||{})['K/D Ratio']||(s.stats||{})['Average K/D Ratio']||'—'
  })).filter(m=>m.matches>0).sort((a,b)=>b.matches-a.matches).slice(0,8);
  if(!maps.length) return '<div class="state">No map data.</div>';
  return `<div class="tbl-wrap"><div class="map-bars">${maps.map(m=>{
    var cls=m.wr>=50?'good':'bad';
    return `<div class="map-bar-row">
      <div class="map-bar-name">${esc(m.name)}</div>
      <div class="map-bar-track"><div class="map-bar-fill ${cls}" style="width:${Math.min(m.wr,100)}%"></div></div>
      <div class="map-bar-meta">${Math.round(m.wr)}% wr · KD ${esc(m.kd)} · ${m.matches}m</div>
    </div>`;
  }).join('')}</div></div>`;
}

/* ── faction ── */
function faction(m,pid){ var t=m.teams||{}; for(var k in t) if((t[k].players||[]).some(p=>p.player_id===pid)) return k; return null; }

/* ── HISTORY ── */
async function loadHistory(slotId,playerId,limit,eloPoints){
  var tbody=document.getElementById('tbody-'+slotId);
  if(!tbody) return;
  tbody.innerHTML=`<tr><td colspan="6" class="muted" style="padding:14px"><span class="spin"></span></td></tr>`;
  try{
    var h=await api('/api/player-id/'+playerId+'/history?limit='+limit);
    var items=h.items||[];
    if(!items.length){ tbody.innerHTML=`<tr><td colspan="6" class="muted" style="padding:14px">No matches.</td></tr>`; return; }

    // Build ELO timeline from elo_changes
    if(eloPoints){
      var pts=[];
      var cur=eloPoints.startElo||0;
      for(var i=items.length-1;i>=0;i--){
        var f=faction(items[i],playerId);
        var ec=items[i].elo_changes&&f?parseInt(items[i].elo_changes[f],10)||0:0;
        pts.push(cur);
        cur+=ec;
      }
      pts.push(cur);
      eloPoints.data=pts;
      var chartEl=document.getElementById('elo-chart-svg-'+slotId);
      var rangeEl=document.getElementById('elo-chart-range-'+slotId);
      if(chartEl&&pts.length>1){
        chartEl.innerHTML=buildChart(pts);
        if(rangeEl) rangeEl.textContent=`${Math.min(...pts)} – ${Math.max(...pts)} ELO`;
      }
    }

    tbody.innerHTML=items.map(m=>{
      var f2=faction(m,playerId), w=m.results&&m.results.winner;
      var win=f2&&w?f2===w:null;
      var score=m.results&&m.results.score?(m.results.score[f2]+':'+m.results.score[f2==='faction1'?'faction2':'faction1']):'—';
      var elo=m.elo_changes&&f2?m.elo_changes[f2]:null;
      var map=(m.voting&&m.voting.map&&m.voting.map.pick&&m.voting.map.pick[0])||m.game_mode||'—';
      var resHtml=win===null?`<span class="res d">?</span>`:(win?`<span class="res w">${esc(score)}</span>`:`<span class="res l">${esc(score)}</span>`);
      var eloHtml='<span class="elo-neu">—</span>';
      if(elo!==null){ var n=parseInt(elo,10); eloHtml=n>0?`<span class="elo-pos">+${n}</span>`:n<0?`<span class="elo-neg">${n}</span>`:`<span class="elo-neu">±0</span>`; }
      var mid=m.match_id||'';
      return `<tr data-mid="${esc(mid)}" data-pid="${esc(playerId)}">
        <td><div class="map-cell"><div class="map-dot"></div><span class="map-name">${esc(map)}</span></div></td>
        <td>${resHtml}</td>
        <td>${eloHtml}</td>
        <td class="muted">${esc(fdate(m.finished_at))}</td>
        <td class="muted">—</td>
        <td><span class="match-id">${esc(mid.slice(0,14))}…</span></td>
      </tr>
      <tr class="detail-row"><td colspan="6"><div class="detail-inner" id="di-${esc(mid)}"></div></td></tr>`;
    }).join('');
    wireRows(tbody.closest('table'));
  }catch(e){
    tbody.innerHTML=`<tr><td colspan="6" style="padding:14px;color:var(--red);font-size:12px">${esc(e.message)}</td></tr>`;
  }
}

function wireRows(tbl){
  tbl.querySelectorAll('tbody tr[data-mid]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      var mid=tr.dataset.mid, pid=tr.dataset.pid;
      var box=document.getElementById('di-'+mid); if(!box) return;
      if(box.classList.contains('show')){ box.classList.remove('show'); return; }
      openDetail(mid,pid,box);
    });
  });
}

async function openDetail(mid,pid,box){
  box.classList.add('show');
  box.innerHTML=`<span class="spin"></span>`;
  try{
    var d=await api('/api/match/'+mid+'/stats');
    var rnd=d.rounds&&d.rounds[0];
    if(!rnd){ box.innerHTML='<span style="color:var(--sub);font-size:12px">No stats available.</span>'; return; }
    var rs=rnd.round_stats||{};
    var meta=`<div class="detail-meta">Map: <b>${esc(rs.Map||'—')}</b> &nbsp;·&nbsp; Score: <b>${esc(rs.Score||'—')}</b></div>`;
    var teams=`<div class="detail-teams">${(rnd.teams||[]).map(t=>{
      var tn=(t.team_stats&&t.team_stats.Team)||'Team';
      var ps=(t.players||[]).map(p=>{ var s=p.player_stats||{}, me=p.player_id===pid;
        return `<div class="d-player${me?' me':''}"><span>${esc(p.nickname)}</span><span class="d-kda">${esc(s.Kills||0)}/${esc(s.Deaths||0)}/${esc(s.Assists||0)}</span></div>`;
      }).join('');
      return `<div class="detail-team"><div class="team-name">${esc(tn)}</div>${ps}</div>`;
    }).join('')}</div>`;
    box.innerHTML=meta+teams;
  }catch(e){ box.innerHTML=`<span style="color:var(--red);font-size:12px">${esc(e.message)}</span>`; }
}

/* ── LIVE match ── */
async function checkLive(playerId,slotId){
  try{
    var h=await api('/api/player-id/'+playerId+'/history?limit=1');
    var m=h.items&&h.items[0];
    if(!m) return;
    // Match is "live" if finished_at is missing or 0
    if(!m.finished_at||m.finished_at===0){
      var map=(m.voting&&m.voting.map&&m.voting.map.pick&&m.voting.map.pick[0])||'—';
      var el=document.getElementById('live-banner-'+slotId);
      if(el) el.innerHTML=`<div class="live-dot"></div><span class="live-text">LIVE</span><span class="live-map">· ${esc(map)}</span><span class="live-score">Match ID: ${esc((m.match_id||'').slice(0,10))}…</span>`;
      if(el) el.style.display='flex';
    }
  }catch(_){}
}

/* ── AUTOCOMPLETE ── */
var acTimers={};
function setupAutocomplete(slotId){
  var inp=document.getElementById('inp-'+slotId);
  var ac=document.getElementById('ac-'+slotId);
  if(!inp||!ac) return;
  var acIndex=-1;
  inp.addEventListener('input',()=>{
    clearTimeout(acTimers[slotId]);
    var q=inp.value.trim();
    if(q.length<2){ ac.classList.remove('show'); return; }
    acTimers[slotId]=setTimeout(async()=>{
      try{
        var s=await api('/api/search?nickname='+encodeURIComponent(q));
        var items=(s.items||[]).slice(0,7);
        if(!items.length){ ac.classList.remove('show'); return; }
        ac.innerHTML=items.map(p=>`<div class="ac-item" data-nick="${esc(p.nickname)}">
          ${p.avatar?`<img class="ac-avatar" src="${esc(p.avatar)}" alt="">`:`<div class="ac-avatar" style="display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--sub)">${esc((p.nickname||'?').slice(0,2).toUpperCase())}</div>`}
          <span class="ac-name">${esc(p.nickname)}</span>
          <span class="ac-meta">${p.games&&p.games.cs2?'ELO '+p.games.cs2.faceit_elo:''}</span>
        </div>`).join('');
        ac.querySelectorAll('.ac-item').forEach(el=>{
          el.addEventListener('mousedown',e=>{ e.preventDefault(); inp.value=el.dataset.nick; ac.classList.remove('show'); });
        });
        ac.classList.add('show');
        acIndex=-1;
      }catch(_){}
    },280);
  });
  inp.addEventListener('keydown',e=>{
    var items=ac.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){ e.preventDefault(); acIndex=Math.min(acIndex+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('focused',i===acIndex)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); acIndex=Math.max(acIndex-1,0); items.forEach((el,i)=>el.classList.toggle('focused',i===acIndex)); }
    else if(e.key==='Enter'&&acIndex>=0){ inp.value=items[acIndex].dataset.nick; ac.classList.remove('show'); go(); }
    else if(e.key==='Escape'){ ac.classList.remove('show'); }
    else if(e.key==='Enter'&&acIndex<0){ go(); }
  });
  document.addEventListener('click',e=>{ if(!ac.contains(e.target)&&e.target!==inp) ac.classList.remove('show'); });
}

/* ── SLOTS ── */
var slots=[{id:0}], slotState={};
var searchRow=document.getElementById('search-row');
var panelsEl=document.getElementById('panels');
var compareBtn=document.getElementById('compare-btn');

function renderInputs(){
  searchRow.innerHTML=slots.map(s=>
    `<div class="search-wrap">
      <input class="search-field" type="text" placeholder="Nickname…" id="inp-${s.id}" autocomplete="off">
      <div class="autocomplete" id="ac-${s.id}"></div>
    </div>`+
    (slots.length>1?`<button class="rm-btn" data-rm="${s.id}">✕</button>`:'')+
    (s===slots[slots.length-1]?`<button class="search-btn" id="go-btn">Search</button>`:'')
  ).join('');
  searchRow.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
    slots=slots.filter(s=>s.id!==+b.dataset.rm); delete slotState[+b.dataset.rm];
    renderInputs(); renderPanels(); compareBtn.textContent='Compare two players';
  }));
  document.getElementById('go-btn').addEventListener('click',go);
  slots.forEach(s=>setupAutocomplete(s.id));
}

compareBtn.addEventListener('click',()=>{
  if(slots.length===1){ slots.push({id:1}); compareBtn.textContent='Remove comparison'; }
  else { slots=[{id:0}]; delete slotState[1]; compareBtn.textContent='Compare two players'; }
  renderInputs(); renderPanels();
});

function renderPanels(){
  panelsEl.className='panels'+(slots.length>1?' dual':'');
  panelsEl.innerHTML=slots.map(s=>`<div class="panel" id="panel-${s.id}"></div>`).join('');
}
function setPanel(id,html){ var e=document.getElementById('panel-'+id); if(e) e.innerHTML=html; }

function go(){ slots.forEach(s=>{ var inp=document.getElementById('inp-'+s.id); var n=inp&&inp.value.trim(); if(n) load(s.id,n); }); }

/* ── MAIN LOAD ── */
async function load(id,nick){
  slotState[id]=slotState[id]||{limit:20};
  setPanel(id,`<div class="state"><span class="spin"></span> Searching for <b>${esc(nick)}</b>…</div>`);

  var player;
  try{ player=await api('/api/player/'+encodeURIComponent(nick)); }
  catch(e){
    var sugg='';
    try{ var s=await api('/api/search?nickname='+encodeURIComponent(nick)); if(s.items&&s.items.length) sugg='<div style="margin-top:10px">'+s.items.slice(0,5).map(p=>`<span class="chip" data-nick="${esc(p.nickname)}">${esc(p.nickname)}</span>`).join('')+'</div>'; }catch(_){}
    setPanel(id,`<div class="state err">Player «${esc(nick)}» not found: ${esc(e.message)}${sugg}</div>`);
    document.getElementById('panel-'+id)&&document.getElementById('panel-'+id).querySelectorAll('[data-nick]').forEach(c=>c.addEventListener('click',()=>{ document.getElementById('inp-'+id).value=c.dataset.nick; load(id,c.dataset.nick); }));
    return;
  }

  var gi=(player.games&&player.games.cs2)||{};
  var lvl=gi.skill_level||'—', elo=gi.faceit_elo||'—';
  var lim=slotState[id].limit;

  var html=`
    <div class="player-card">
      ${player.avatar?`<img class="avatar" src="${esc(player.avatar)}" alt="">`:`<div class="avatar-fallback">${esc((player.nickname||'??').slice(0,2).toUpperCase())}</div>`}
      <div>
        <div class="player-name">${esc(player.nickname||nick)}</div>
        <div class="player-tags">
          <span class="tag accent">ELO ${esc(elo)}</span>
          <span class="tag">Level ${esc(lvl)}</span>
          ${player.country?`<span class="tag">${esc(player.country.toUpperCase())}</span>`:''}
          <span class="tag">CS2</span>
        </div>
      </div>
      <div class="player-actions">${player.faceit_url?`<a class="player-link" href="${esc(player.faceit_url)}" target="_blank">FACEIT ↗</a>`:''}</div>
    </div>

    <div class="live-banner" id="live-banner-${id}" style="display:none"></div>

    <div id="streak-${id}"></div>

    ${renderEloProgress(elo)}

    <div class="elo-chart-wrap">
      <div class="elo-chart-head">
        <span class="elo-chart-title">ELO History</span>
        <span class="elo-chart-range" id="elo-chart-range-${id}">loading…</span>
      </div>
      <div id="elo-chart-svg-${id}"><div style="color:var(--sub);font-size:12px"><span class="spin"></span></div></div>
    </div>

    <div id="stats-${id}"><div class="state"><span class="spin"></span></div></div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">Match History</span>
        <div class="hist-filters" id="hf-${id}">
          ${[10,20,50,100].map(n=>`<button class="hf${n===lim?' active':''}" data-n="${n}">${n}</button>`).join('')}
        </div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Map</th><th>Result</th><th>ELO</th><th>Date</th><th>Kills</th><th>Match ID</th></tr></thead>
          <tbody id="tbody-${id}"><tr><td colspan="6" class="muted" style="padding:14px"><span class="spin"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><span class="section-title">Maps</span></div>
      <div id="maps-${id}"><div class="state"><span class="spin"></span></div></div>
    </div>

    <div id="raw-wrap-${id}"></div>
  `;
  setPanel(id,html);

  // Hist filters
  document.getElementById('hf-'+id).querySelectorAll('[data-n]').forEach(b=>{
    b.addEventListener('click',()=>{
      document.getElementById('hf-'+id).querySelectorAll('[data-n]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); slotState[id].limit=+b.dataset.n;
      loadHistory(id,player.player_id,slotState[id].limit,null);
    });
  });

  // Parallel loads
  var eloCtx={startElo:parseInt(elo,10)||0};
  checkLive(player.player_id,id);
  loadHistory(id,player.player_id,lim,eloCtx);

  try{
    var st=await api('/api/player-id/'+player.player_id+'/stats');
    var lt=st.lifetime||{};
    document.getElementById('stats-'+id).innerHTML=renderStats(lt);
    document.getElementById('maps-'+id).innerHTML=renderMaps(st.segments);

    // Streak strip
    var recent=lt['Recent Results'];
    if(recent){
      var arr=Array.isArray(recent)?recent:String(recent).split('');
      document.getElementById('streak-'+id).innerHTML=renderStreak(arr);
    }

    // Raw stats
    var rw=document.getElementById('raw-wrap-'+id);
    if(rw&&Object.keys(lt).length){
      var rows=Object.keys(lt).filter(k=>k!=='Recent Results').map(k=>`<div class="raw-row"><span class="raw-key">${esc(k)}</span><span>${esc(lt[k])}</span></div>`).join('');
      rw.innerHTML=`<button class="raw-toggle" id="rt-${id}">Show all API metrics ↓</button><div class="raw-box" id="rb-${id}">${rows}</div>`;
      document.getElementById('rt-'+id).addEventListener('click',()=>{
        document.getElementById('rb-'+id).classList.toggle('show');
        document.getElementById('rt-'+id).textContent=document.getElementById('rb-'+id).classList.contains('show')?'Hide metrics ↑':'Show all API metrics ↓';
      });
    }
  }catch(e){
    document.getElementById('stats-'+id).innerHTML=`<div class="state err">${esc(e.message)}</div>`;
  }
}

renderInputs();
})();
</script>
</body>
</html>
